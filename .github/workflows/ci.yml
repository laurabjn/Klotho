name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: klotho
          POSTGRES_PASSWORD: klotho
          POSTGRES_DB: klotho_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klotho -d klotho_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://klotho:klotho@localhost:5432/klotho_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint, typecheck, unit tests, build
        run: npx turbo run lint typecheck test build

      - name: Migrations apply on a blank database
        run: npm run db:deploy -w @klotho/api

      - name: API smoke test (e2e)
        run: npx turbo run test:e2e
