services:
  postgres:
    image: postgres:15-alpine
    container_name: klotho-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-klotho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-klotho}
      POSTGRES_DB: ${POSTGRES_DB:-klotho}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
